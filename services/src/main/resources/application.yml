spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: loan-services
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      file: ./compose.yaml

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

app:
  redis:
    enabled: ${REDIS_ENABLED:true}
  jwt:
    secret: "dev-only-secret-CHANGE-ME-please-use-vault-in-prod-0123456789abcdef"
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"
  password-reset:
    ttl-minutes: 30
  frontend:
    reset-url: "http://localhost:3000/reset-password"
  security:
    login:
      max-attempts: 5
      window-minutes: 15

logging:
  level:
    org.flywaydb: INFO
    LOANS.services: DEBUG
